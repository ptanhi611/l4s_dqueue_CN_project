# Same as router_config.ini, except the scheduler starvation breaker is switched off.
# Used by eval/run_final.sh to test whether the breaker causes the L4S latency spikes.
[router]
mode = dualq                  # fifo | dualq_basic | dualq (+ RFC overload) | dualq_qp (+ queue protection) | dualq_qp_police (+ rate limit)
rate_mbps = 50.0              # bottleneck rate, enforced inside our router (not by tc)
queue_limit_bytes = 1500000   # shared buffer, ~240 ms at 50 Mbps (deep, to show bufferbloat in fifo)
stats_file = eval/results/router_stats.csv
stats_interval_ms = 100

[network]
in_if = r0-eth0               # towards h1 (sender)
out_if = r0-eth1              # towards h2 (receiver)
h1_ip = 10.0.1.1
h2_ip = 10.0.2.1
h1_mac = 00:00:00:00:01:01    # fixed in mininet/topo_bottleneck.py
h2_mac = 00:00:00:00:02:01

[aqm]
target_c_ms = 15.0
target_l_ms = 1.0
time_update_ms = 16.0
alpha = 0.16
beta = 3.20
k_factor = 2.0

[scheduler]
l_quantum_bytes = 4500
classic_max_wait_ms = 1000.0  # breaker effectively OFF (the 4500 B quantum still guarantees Classic service)

[queue_protection]               # only used in modes dualq_qp and dualq_qp_police
qp_max_flow_bytes = 30000     # one flow may hold at most this much of the L4S queue (~5 ms at 50 Mbps)
qp_sanction_ms = 1000         # a flow that goes over is sent to the Classic queue for this long
qp_police_rate_mbps = 5        # dualq_qp_police: a sanctioned flow may send at most this much (10% of the link)
